# Alembic database migration configuration (ASCII for Windows locale compatibility)
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# The database URL is overridden from environment settings in migrations/env.py.
sqlalchemy.url = sqlite:///./a_stock.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
